name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm install

      - name: Lint (optional)
        run: |
          npm run lint --if-present

      - name: Test (optional)
        run: |
          npm test --if-present

