services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Ajuste conforme src/db/mysql.js
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASS=
      - DB_NAME=sgst_bd
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_DATABASE=sgst_bd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

